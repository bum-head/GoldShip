<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Weather Raw Data</title></head>
<body bg color="#000000" text="#00FF00">
  <input id="lat" value="26.73" placeholder="Latitude">
  <input id="lon" value="93.15" placeholder="Longitude">
  <button onclick="getWeather()">Get Weather</button>
  <pre id="out"></pre>

  <script>
    function getWeather() {
      const lat = document.getElementById("lat").value;
      const lon = document.getElementById("lon").value;
      fetch(`/weather?lat=${lat}&lon=${lon}`)
        .then(r => r.text())
        .then(t => document.getElementById("out").textContent = t)
        .catch(e => document.getElementById("out").textContent = e);
    }
    getWeather();
  </script>
</body>
</html>

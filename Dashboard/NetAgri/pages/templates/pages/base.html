<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NetAgri{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{% url 'home' %}">NetAgri</a>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
        </nav>
    </header>

    <main class="container {% block main_class %}{% endblock %}">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>NetAgri &copy; 2026</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>

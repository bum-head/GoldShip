{% extends "pages/base.html" %}

{% block title %}Log In | NetAgri{% endblock %}

{% block content %}
    <section class="content-section">
        <h1>Log in</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <input type="hidden" name="next" value="{{ next }}">

            <button class="button" type="submit">
                Log in
            </button>
        </form>
    </section>
{% endblock %}

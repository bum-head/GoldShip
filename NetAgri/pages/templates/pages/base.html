<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NetAgri{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{% url 'home' %}">NetAgri</a>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'marketplace:crop_list' %}">Browse crops</a>
            {% if user.is_authenticated %}
                <a href="{% url 'marketplace:create_listing' %}">
                    Add a crop
                </a>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>NetAgri &copy; 2026</p>
    </footer>
</body>
</html>
